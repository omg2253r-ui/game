<!doctype html>
<html lang="th" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="สร้างโมเดล 3D จากคำอธิบาย แล้วดาวน์โหลดไฟล์ GLB ไปใช้ในเกมและงานออกแบบ"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>3D Design</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var p = JSON.parse(localStorage.getItem('d3-prefs') || '{}').state || {};
        var t = p.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = t;
        if (p.locale) document.documentElement.lang = p.locale;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
