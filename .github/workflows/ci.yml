name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (client + server)
        run: npm run typecheck
      - name: Unit, balance and validation tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Worker bundle dry-run
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry

  deploy:
    # Deploys only from main and only when the repository has a Cloudflare token secret.
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply D1 migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply scrapbound --remote
      - name: Deploy Worker + static assets
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
